<div class="custom-request-content">
          <h2>חיפוש והזמנת ספר מיוחד</h2>
          <p>לא מצאת את הספר שחיפשת באתר? מלא את הפרטים ונשלח לאוראל הודעת וואטסאפ מסודרת לבדיקת זמינות והזמנה.</p>
          
          <div class="form-group">
            <label for="customBookName">שם הספר:</label>
            <input type="text" id="customBookName" class="form-input" placeholder="לדוגמה: אורות התשובה">
          </div>

          <div class="form-group">
            <label for="customBookAuthor">שם המחבר (אופציונלי):</label>
            <input type="text" id="customBookAuthor" class="form-input" placeholder="לדוגמה: הרב קוק">
          </div>

          <div class="form-group">
            <label for="customBookDetails">כמות, מהדורה או הערות נוספות:</label>
            <textarea id="customBookDetails" class="form-textarea" placeholder="לדוגמה: אני צריך 2 עותקים, כריכה קשה אם אפשר..."></textarea>
          </div>

          <a href="#" target="_blank" class="btn-checkout" id="sendCustomWaBtn" onclick="sendCustomWhatsApp()">

        </div>
